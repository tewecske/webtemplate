# Prod config — select with -Dconfig.resource=application-prod.conf
# Values below are illustrative defaults; ${?VAR} lets an env var override
# each one at deploy time without editing this file.
app {
  host = "0.0.0.0"
  host = ${?APP_HOST}

  port = 8080
  port = ${?APP_PORT}

  sqlite-path = "/var/lib/webtemplate/cask.sqlite"
  sqlite-path = ${?APP_SQLITE_PATH}
}
