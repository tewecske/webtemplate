# Test config — select with -Dconfig.resource=application-test.conf
# Separate port and sqlite file from dev so a test run never touches dev data.
app {
  host = "127.0.0.1"
  port = 18080
  sqlite-path = "data/cask-test.sqlite"
  auth {
    session-cookie-name = "cask_session"
    secure-cookie = false
    google-dev-login-enabled = true
    session-ttl-days = 7
    seed-admin-enabled = true
    seed-admin-email = "leventewe@gmail.com"
    seed-admin-password = "test1234"
    allowed-origins = ["http://localhost:5173"]
  }
}
