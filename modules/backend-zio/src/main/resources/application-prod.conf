# Prod config — select with -Dconfig.resource=application-prod.conf
# Values below are illustrative defaults; ${?VAR} lets an env var override
# each one at deploy time without editing this file.
app {
  host = "0.0.0.0"
  host = ${?APP_HOST}

  port = 8081
  port = ${?APP_PORT}

  sqlite-path = "/var/lib/webtemplate/zio.sqlite"
  sqlite-path = ${?APP_SQLITE_PATH}

  # Invariants that must never regress in prod (see CLAUDE.md "Authentication"):
  # secure-cookie must stay true, google-dev-login-enabled must stay false, seed-admin-enabled
  # must stay gated, and allowed-origins must never be loosened to an unbounded/wildcard value
  # — it's the CSRF Origin/Referer allowlist for state-changing requests.
  auth {
    session-cookie-name = "zio_session"
    secure-cookie = true
    google-dev-login-enabled = false
    session-ttl-days = 7
    seed-admin-enabled = false
    seed-admin-email = "unused"
    seed-admin-password = "unused"

    # Real deployment origin(s) of the frontend, e.g. ["https://app.example.com"].
    # Override via env var with HOCON array syntax, e.g. APP_ALLOWED_ORIGINS='["https://app.example.com"]'.
    allowed-origins = ["https://example.com"]
    allowed-origins = ${?APP_ALLOWED_ORIGINS}
  }
}
