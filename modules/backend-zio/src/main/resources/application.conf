# Dev config — loaded by default (no -Dconfig.resource override needed).
app {
  host = "0.0.0.0"
  port = 8080
  sqlite-path = "data/web.sqlite"
  auth {
    session-cookie-name = "web_session"
    secure-cookie = false
    google-dev-login-enabled = true
    session-ttl-days = 7
    seed-admin-enabled = true
    seed-admin-email = "leventewe@gmail.com"
    seed-admin-password = "test1234"
    # Vite's dev server default port (web/vite.config.ts) — used for the Origin/Referer CSRF check.
    allowed-origins = ["http://localhost:5173"]
  }
}
