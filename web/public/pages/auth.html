<div id="auth-section" class="mt-6">
  <div class="flex">
    <button type="button" data-auth-tab="login"
      class="auth-tab">
      Log in
    </button>
    <button type="button" data-auth-tab="signup"
      class="auth-tab">
      Sign up
    </button>
  </div>

  <form id="login-form" class="auth-form">
    <div>
      <label class="mb-1">Email</label>
      <input type="email" class="login-email" required />
    </div>
    <div>
      <label class="mb-1">Password</label>
      <input type="password" class="login-password" required />
    </div>
    <button type="submit" class="btn">
      Log in
    </button>
    <p class="login-error"></p>
  </form>

  <form id="signup-form" class="auth-form hidden">
    <div>
      <label class="mb-1">Email</label>
      <input type="email" class="signup-email" required />
    </div>
    <div>
      <label class="mb-1">Password</label>
      <input type="password" class="signup-password" required minlength="8" />
      <p class="mt-1">At least 8 characters.</p>
    </div>
    <button type="submit" class="btn">
      Sign up
    </button>
    <p class="signup-error"></p>
  </form>

  <div class="mt-6">
    <p class="text-xs">Google (dev stub)</p>
    <p class="mt-1">
      No real Google OAuth wired up — enter any email to simulate a Google sign-in in dev.
    </p>
    <form id="google-dev-form">
      <div class="mt-2">
        <input type="email" class="google-dev-email"
          placeholder="you@example.com" required />
        <button type="submit" class="btn">
          Continue with Google (dev)
        </button>
      </div>
      <p class="google-dev-error"></p>
    </form>
  </div>
</div>
