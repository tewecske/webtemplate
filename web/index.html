<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Scala.js</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="h-full bg-base-200 text-base-content antialiased">
  <main class="mx-auto max-w-4xl px-6 py-12">
    <nav class="mb-8 flex items-center justify-between gap-4 text-sm">
      <a href="/index.html" class="font-semibold text-primary">&larr; Template Home</a>
      <div class="flex items-center gap-4 text-base-content/60">
        <select id="theme-select" class="select select-bordered select-xs" aria-label="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="cupcake">Cupcake</option>
          <option value="synthwave">Synthwave</option>
          <option value="corporate">Corporate</option>
        </select>
      </div>
    </nav>

    <h1 class="text-2xl font-bold tracking-tight">Scala.js</h1>
    <p class="mt-2 text-base-content/70">
      DOM/fetch logic is written in Scala and compiled to JS
      via the Scala.js sbt plugin. It reuses the exact same request/response case classes as
      the JVM backend via the <code class="rounded bg-base-300 px-1">shared</code> module.
    </p>

    <div id="auth-mount"></div>

    <div id="user-menu" class="mt-6 hidden flex items-center justify-between text-sm"></div>

    <div id="not-admin-section" class="mt-6 hidden">
      <p class="text-sm text-base-content/70">
        You're signed in but not an admin. <a href="#/" class="text-primary hover:underline">Back to entries</a>.
      </p>
    </div>

    <div id="not-found-section" class="mt-6 hidden">
      <p class="text-sm text-base-content/70">
        User not found. <a href="#/users" class="text-primary hover:underline">Back to user list</a>.
      </p>
    </div>

    <div id="entries-mount"></div>

    <div id="users-mount"></div>
  </main>
  <script type="module" src="./scalajs/main.js"></script>
</body>

</html>
