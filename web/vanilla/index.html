<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla JS Variant</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased">
    <main class="mx-auto max-w-2xl px-6 py-12">
      <nav class="mb-8 flex items-center justify-between text-sm">
        <a href="/index.html" class="font-semibold text-indigo-600">&larr; Template Home</a>
        <div class="flex gap-4 text-slate-500">
          <span class="font-semibold text-slate-900">Vanilla JS</span>
          <a href="/ts/index.html" class="hover:text-indigo-600">TypeScript</a>
          <a href="/scalajs/index.html" class="hover:text-indigo-600">Scala.js</a>
        </div>
      </nav>

      <h1 class="text-2xl font-bold tracking-tight">Vanilla JavaScript Variant</h1>
      <p class="mt-2 text-slate-600">
        Type a value, click Save. It's POSTed to the backend, stored in SQLite, and the full
        history for that field is read back and rendered below.
      </p>

      <div class="mt-6 flex items-center gap-2 text-sm">
        <label for="backend-select" class="font-medium text-slate-700">Backend:</label>
        <select id="backend-select" class="rounded-md border-slate-300 py-1.5 text-sm">
          <option value="cask">Cask (:8080)</option>
          <option value="zio">ZIO HTTP (:8081)</option>
        </select>
      </div>

      <div class="mt-6 space-y-4">
        <div data-input-id="note-a" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
          <label class="mb-1 block text-sm font-medium text-slate-700">Note A</label>
          <div class="flex gap-2">
            <input
              type="text"
              class="entry-input flex-1 rounded-md border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
              placeholder="Type a value…"
            />
            <button
              class="save-btn rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
            >
              Save
            </button>
          </div>
          <ul class="history-list mt-3 space-y-1 text-sm text-slate-600"></ul>
        </div>

        <div data-input-id="note-b" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
          <label class="mb-1 block text-sm font-medium text-slate-700">Note B</label>
          <div class="flex gap-2">
            <input
              type="text"
              class="entry-input flex-1 rounded-md border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
              placeholder="Type a value…"
            />
            <button
              class="save-btn rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
            >
              Save
            </button>
          </div>
          <ul class="history-list mt-3 space-y-1 text-sm text-slate-600"></ul>
        </div>

        <div data-input-id="note-c" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
          <label class="mb-1 block text-sm font-medium text-slate-700">Note C</label>
          <div class="flex gap-2">
            <input
              type="text"
              class="entry-input flex-1 rounded-md border-slate-300 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
              placeholder="Type a value…"
            />
            <button
              class="save-btn rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
            >
              Save
            </button>
          </div>
          <ul class="history-list mt-3 space-y-1 text-sm text-slate-600"></ul>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
